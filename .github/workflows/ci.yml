name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit

      # VS Code (Electron) needs a display on headless Linux runners
      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - run: npm run package
